---
name: renovate-config-validator
on:
  pull_request:
    paths:
      - .github/workflows/renovate-config-validator.yaml
      - renovate.json5
jobs:
  renovate-config-validator:
    uses: suzuki-shunsuke/github-action-renovate-config-validator/.github/workflows/renovate-config-validator.yaml@1e1604219a6b38ae9a10aff42a28a3656322c31a # v2.4.1
    permissions:
      contents: read
  status-check:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions: {}
    if: failure()
    steps:
      - run: exit 1
    needs:
      - renovate-config-validator
